<body>
	<div id="overlay" class="hidden">Drop .ssd file to load.</div>
	<div id="coverEverythingDiv">
		<div id="topPanel"> <!-- This panel is hidden when printing-->
			<div class="fileToolBox">
				<div class="eMenu">
					<button class="menuButton" id="btn_file">File</button>
					<div class="menuContent">
						<span>
							<button id="btn_new" data-title="New (Ctrl+N)"><u>N</u>ew<span class="shortcut">Ctrl N</span></button>
						</span>
						<span>
							<button id="btn_load"><u>O</u>pen<span class="shortcut">Ctrl O</span></button>
						</span>
						<span>
							<button id="btn_save"><u>S</u>ave<span class="shortcut">Ctrl S</span></button>
						</span>
						<span>
							<button id="btn_save_as" data-title="Save As (Ctrl+Shift+S)" style="display: none;">Save As...<span class="shortcut">Ctrl Shift S</span></button>
						</span>
						<span class="menuSeparator">
							<button id="btn_import" style="display: none;">Import from file...</button>
						</span>
						<span>
							<button id="btn_export" style="display: none;">Export to file...</button>
						</span>
						<span>
							<button id="btn_browser_models" style="display: none;">Models in Browser...</button>
						</span>
						<span id="recent_title" style="display: none">

						</span>
						<span>
							<button id="btn_recent_0" style="display: none;">Recent 0</button>
						</span>
						<span>
							<button id="btn_recent_1" style="display: none;">Recent 1</button>
						</span>
						<span>
							<button id="btn_recent_2" style="display: none;">Recent 2</button>
						</span>
						<span>
							<button id="btn_recent_3" style="display: none;">Recent 3</button>
						</span>
						<span>
							<button id="btn_recent_4" style="display: none;">Recent 4</button>
						</span>
						<span>
							<button id="btn_recent_5" style="display: none;">Recent 5</button>
						</span>
						<span>
							<button id="btn_recent_6" style="display: none;">Recent 6</button>
						</span>
						<span>
							<button id="btn_recent_7" style="display: none;">Recent 7</button>
						</span>
						<span>
							<button id="btn_recent_8" style="display: none;">Recent 8</button>

						<span>

				<!-- Simulation Settings are intentionally hidden from the menu bar for the current release. -->

		</div> <!-- End of topPanel -->

		<div class="tool-panel run-tool-panel" aria-label="Editor and simulation controls">
			<div class="tool-grouping editor-actions" aria-label="Selection and history tools">
				<button id="btn_mouse" data-title="Mouse (M)" class="tool-button" data-tool="mouse">
					<img src="graphics/mouse.svg" />
				</button>
				<button id="btn_delete" data-title="Delete" class="tool-button" data-tool="delete">
					<img src="graphics/delete.svg" />
				</button>
				<button id="btn_undo" data-title="Undo (Ctrl+Z)" class="tool-button" data-tool="undo" disabled>
					<img src="graphics/undo.svg" />
				</button>
				<button id="btn_redo" data-title="Redo (Ctrl+Y)" class="tool-button" data-tool="redo" disabled>
					<img src="graphics/redo.svg" />
				</button>
				<button id="btn_find_variable" type="button" data-title="Find (Ctrl+F)" class="toolbar-action-button" aria-label="Find variable">
					<img class="toolbar-inline-icon" src="graphics/find.svg" alt="" aria-hidden="true" />
				</button>
				<button id="btn_find_ghosts" type="button" data-title="Find Ghosts (Ctrl+G)" class="toolbar-action-button" aria-label="Find next ghost of selected variable" disabled>
					<img class="toolbar-inline-icon" src="graphics/find_ghost.svg" alt="" aria-hidden="true" />
				</button>
			</div>
			<div class="tool-grouping editing-actions" aria-label="Clipboard and colour tools">
				<button id="btn_cut" type="button" data-title="Cut (Ctrl+X)" class="toolbar-action-button" aria-label="Cut selected model structure">
					<img class="toolbar-inline-icon" src="graphics/cut.svg" alt="" aria-hidden="true" />
				</button>
				<button id="btn_copy" type="button" data-title="Copy (Ctrl+C)" class="toolbar-action-button" aria-label="Copy selected model structure">
					<svg class="toolbar-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-10A1.5 1.5 0 0 0 3 5.5v10A1.5 1.5 0 0 0 4.5 17H8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
				</button>
				<button id="btn_paste" type="button" data-title="Paste (Ctrl+V)" class="toolbar-action-button" aria-label="Paste copied model structure" disabled>
					<svg class="toolbar-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h6M9 3h6v4H9V3Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 5H5.5A1.5 1.5 0 0 0 4 6.5v13A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5v-13A1.5 1.5 0 0 0 18.5 5H17" fill="none" stroke="currentColor" stroke-width="2"/></svg>
				</button>
				<div class="toolbar-colour-control">
					<button id="btn_colour" type="button" data-title="Colour" class="toolbar-action-button" aria-label="Change colour of selection" aria-expanded="false">
						<img class="toolbar-inline-icon" src="graphics/colour-pallet.svg" alt="" aria-hidden="true" />
					</button>
					<div id="toolbar-colour-picker" class="toolbar-colour-picker" hidden role="menu" aria-label="Selection colour">
						<button id="btn_black" type="button" class="toolbar-colour-swatch" style="--swatch:black" data-title="Black" aria-label="Black"></button>
						<button id="btn_grey" type="button" class="toolbar-colour-swatch" style="--swatch:silver" data-title="Grey" aria-label="Grey"></button>
						<button id="btn_red" type="button" class="toolbar-colour-swatch" style="--swatch:red" data-title="Red" aria-label="Red"></button>
						<button id="btn_deeppink" type="button" class="toolbar-colour-swatch" style="--swatch:deeppink" data-title="Pink" aria-label="Pink"></button>
						<button id="btn_brown" type="button" class="toolbar-colour-swatch" style="--swatch:brown" data-title="Brown" aria-label="Brown"></button>
						<button id="btn_orange" type="button" class="toolbar-colour-swatch" style="--swatch:orange" data-title="Orange" aria-label="Orange"></button>
						<button id="btn_gold" type="button" class="toolbar-colour-swatch" style="--swatch:gold" data-title="Gold" aria-label="Gold"></button>
						<button id="btn_olive" type="button" class="toolbar-colour-swatch" style="--swatch:olive" data-title="Olive" aria-label="Olive"></button>
						<button id="btn_green" type="button" class="toolbar-colour-swatch" style="--swatch:green" data-title="Green" aria-label="Green"></button>
						<button id="btn_teal" type="button" class="toolbar-colour-swatch" style="--swatch:teal" data-title="Teal" aria-label="Teal"></button>
						<button id="btn_blue" type="button" class="toolbar-colour-swatch" style="--swatch:blue" data-title="Blue" aria-label="Blue"></button>
						<button id="btn_magenta" type="button" class="toolbar-colour-swatch" style="--swatch:magenta" data-title="Magenta" aria-label="Magenta"></button>
					</div>
				</div>
			</div>
			<div class="tool-grouping output-actions" aria-label="Output displays">
				<button id="btn_equations" data-title="Equations (E)" class="tool-button" data-tool="equations" aria-label="Equations">
					<img src="graphics/equations.svg" alt="" aria-hidden="true" />
				</button>
				<button id="btn_table" data-title="Table (T)" class="tool-button" data-tool="table">
					<img src="graphics/table.svg" />
				</button>
				<button id="btn_compareplot" data-title="Time Plot (P)" class="tool-button" data-tool="compareplot">
					<img src="graphics/timeplot.svg" />
				</button>
				<button id="btn_xyplot" data-title="XY Plot (X)" class="tool-button" data-tool="xyplot">
					<img src="graphics/xyplot.svg" />
				</button>
				<button id="btn_histoplot" data-title="Histogram (H)" class="tool-button" data-tool="histoplot">
					<img src="graphics/histoplot.svg" />
				</button>
				<button id="btn_calibration_sandbox" type="button" data-title="Calibration Sandbox" class="tool-button" aria-label="Calibration Sandbox">
					<img src="graphics/calibration-sandbox.svg" alt="" aria-hidden="true" />
				</button>
			</div>
			<div class="tool-grouping" id="runControllerArea">
				<div id="systemika-run-controls">
					<label for="systemika-run-name">Run Name</label>
					<input id="systemika-run-name" type="text" value="Base" autocomplete="off" spellcheck="false" aria-label="Simulation run name" />
					<button id="btn_open_runs_folder" type="button" data-title="Manage Runs" aria-label="Manage Runs">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5Zm2 2v10h14V7H5Z"/></svg>
					</button>
				</div>
				<button id="btn_clear" data-title="Clear Outputs (Ctrl+0)" class="tool-button" data-tool="clear" aria-label="Clear Outputs">
					<img src="graphics/eraser.svg" alt="" aria-hidden="true" />
				</button>
				<button id="btn_run" data-title="Run/Pause (Ctrl+1)" class="tool-button" data-tool="run">
					<img id="imgRunPauseTool" src="graphics/run.svg" />
				</button>
				<button id="btn_step" data-title="Advance (Ctrl+2)" class="tool-button" data-tool="step">
					<img src="graphics/step.svg" />
				</button>
				<button id="btn_finish" data-title="Advance to End (Ctrl+3)" class="tool-button" disabled data-tool="finish" aria-label="Advance to End">
					<svg class="toolbar-inline-icon" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M3 6l6 6-6 6V6Zm7 0 6 6-6 6V6Zm9-1v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
					</svg>
				</button>
				<div id="progress-bar">
					<div id="progress-bar-text" data-title="Start / Current / End &#10; Method(Step)">
					</div>
				</div>
				<button id="btn_timeunit">
					<div id="timeunit-label">Time Unit</div>
					<div id="timeunit-value">None</div>
				</button>
				<button id="btn_check_units">
					<div id="check_units-label">Check Units</div>
					<div id="check_units-value">Report</div>
				</button>
				<button id="unsaved_changes" type="button" class="hidden" data-title="Save unsaved changes">
					<div id="unsaved_changes-value">Unsaved<br/>Changes</div>
				</button>
			</div> <!-- End of runControllArea -->


		</div> <!-- End of top tool-panel-->
		<div class="info-bar">
				<div class="info-bar__definition info-box__element" data-title="Selection"></div>
				<!--<div style="border-left:1px solid #ccc; margin: 6px  0px;"></div>--> <!--Divider here-->
				<div class="info-bar__definition-error info-box__element"

				</div>
				<div id="systemika-browser-compatibility-status" class="systemika-browser-compatibility-status" role="status" aria-label="Browser compatibility notice" title="Firefox and Safari do not provide the local project-folder access used for full file and simulation-run management.">Firefox and Safari are not fully supported: use Chrome or Edge for full file and run management.</div>
		</div>

		<!-- Working area -->
		<div class="workspace-row">
			<div class="model-tool-panel" aria-label="Model creation tools">
			<div class="tool-grouping">
				<button id="btn_stock" data-title="Stock (S)" class="tool-button" data-tool="stock">

				</button>
				<button id="btn_flow" data-title="Flow (F)" class="tool-button" data-tool="flow">
					<img src="graphics/flow.svg" />
				</button>
				<button id="btn_link" data-title="Link (L)" class="tool-button" data-tool="link">

				</button>
				<button id="btn_variable" data-title="Auxiliary (A)" class="tool-button" data-tool="variable">

				<button id="btn_constant" data-title="Constant (C)" class="tool-button" data-tool="constant">
					<img src="graphics/constant.svg" />
				</button>
				<button id="btn_converter" data-title="Lookup (K)" class="tool-button" data-tool="converter">
					<img src="graphics/converter.svg" />
				</button>
				<button id="btn_ghost" data-title="Ghost (G)" class="tool-button" data-tool="ghost">
					<img src="graphics/ghost.svg" />
				</button>
			</div>
			<div class="tool-grouping" aria-label="Model display tools">
				<button id="btn_question_marks" type="button" data-title="Hide/Unhide Question Marks (Q)" class="tool-button" data-action="toggle-question-marks" aria-label="Hide/Unhide Question Marks (Q)" aria-pressed="false">
					<img src="graphics/hidden.svg" alt="" aria-hidden="true" />
				</button>
			</div>
			<div class="tool-grouping">
				<button id="btn_rotatename" data-title="Rotate Name (R)" class="tool-button" data-tool="rotatename">
					<img src="graphics/rotate_name.svg" />
				</button>
				<button id="btn_movevalve" data-title="Move Valve" class="tool-button" data-tool="movevalve">
					<img src="graphics/move_valve.svg">
				</button>
				<button id="btn_straighten_link" data-title="Straighten Link" class="tool-button" data-tool="straightenlink">
					<img src="graphics/straighten_link.svg">
				</button>
				<button id="btn_text" data-title="Text" class="tool-button" data-tool="text">
					<img src="graphics/text.svg" />
				</button>
				<button id="btn_rectangle" data-title="Rectangle (shift gives square)" class="tool-button"
					data-tool="rectangle">
					<img src="graphics/rectangle.svg" />
				</button>
				<button id="btn_ellipse" data-title="Ellipse (shift gives circle)" class="tool-button" data-tool="ellipse">
					<img src="graphics/ellipse.svg" />
				</button>
				<button id="btn_line" data-title="Arrow/Line" class="tool-button" data-tool="line">
					<img src="graphics/arrow.svg" />
				</button>
			</div>
			</div>
			<div id="svgplanebackground"
			style="overflow: scroll; flex-grow: 1; border: 2px solid var(--color-border); z-index: 3; width: calc(100% - 0.5rem); position: relative; display: inline-block; font-family: Arial, Helvetica, sans-serif">
			<div id="svgBlockOverlay"
				style="position: absolute; left: 0px; top: 0px; display: none; z-index: 110; width: 100%; height: 100%; background-color: red; opacity: 0;">
			</div>
			<svg draggable="false" id="svgplane" width="6000" height="2000" style="background-color: white;">
				<!-- Links and their draggable handles paint first. Decorative annotations
				     (text boxes and geometry shapes) paint above links but below every model
				     entity, so a Stock/Auxiliary/Flow/etc. remains the click target where
				     annotations overlap the model. -->
				<g class="layer link"></g>
				<g class="layer annotation"></g>
				<g class="layer anchor"></g>
				<g class="layer stock"></g>
				<g class="layer variable"></g>
				<g class="layer constant"></g>
				<g class="layer converter"></g>
				<g class="layer flow"></g>
				<g class="layer plot"></g>
				<!-- Selected Flow endpoint/elbow handles live above Stocks while editing so
				     an attached endpoint can always be grabbed and detached. -->
				<g class="layer flow-anchor-edit"></g>
				<!-- Stock and Auxiliary names remain the final SVG layer so flow handles,
				     pipes, valves, links, and other graphics can never paint over them. -->
				<g class="layer stock-label"></g>
			</svg>
		</div>
		<div id="systemika-output-splitter" class="systemika-output-splitter systemika-output-hidden" role="separator" aria-orientation="vertical" aria-label="Resize modeling and output panels"></div>
		<aside id="systemika-output-panel" class="systemika-output-panel systemika-output-hidden" aria-label="Outputs" aria-hidden="true">
			<div class="systemika-output-header">
				<strong id="systemika-output-title">Equations</strong>
				<div id="systemika-output-actions" class="systemika-output-actions" aria-label="Output export actions"></div>
				<button id="systemika-output-detach" class="systemika-output-detach-button" type="button" title="Detach output panel" aria-label="Detach output panel">
					<img src="graphics/unlink.svg" alt="" aria-hidden="true" />
				</button>
				<button id="systemika-output-close" class="systemika-output-close-button" type="button" title="Close output panel" aria-label="Close output panel">×</button>
			</div>
			<div id="systemika-output-body" class="systemika-output-body">
				<div id="systemika-output-view" class="systemika-output-view"></div>
				<div id="systemika-output-horizontal-splitter" class="systemika-output-horizontal-splitter" role="separator" aria-orientation="horizontal" aria-label="Resize output and settings panels"></div>
				<div id="systemika-output-settings" class="systemika-output-settings"></div>
			</div>
			<div id="systemika-output-holding" class="systemika-output-holding" aria-hidden="true"></div>
		</aside>
		</div> <!-- End of workspace-row -->
		<div class="editor-footer" style="display: none;">
			<div class="editor-footer-filepath">FilePath/FileName</div>
			<div style="padding: 0px 16px;">|</div>

		</div>
	</div>
